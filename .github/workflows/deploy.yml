name: CI/CD Pipeline Simulation

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ----- Run Python checks/tests -----
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest || echo "No tests found — continuing"

      # ----- Build Docker image (simulated app) -----
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t local-simulation-app:latest .

      # ----- Login to Docker Hub (simulated registry) -----
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # ----- Tag and push image -----
      - name: Push image to Docker Hub
        run: |
          docker tag local-simulation-app:latest ${{ secrets.DOCKER_USERNAME }}/local-simulation-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/local-simulation-app:latest

      # ----- Simulated deployment step -----
      - name: Simulated Deployment Step
        run: |
          echo "Simulated deployment completed successfully."
